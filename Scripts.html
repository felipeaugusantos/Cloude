<script>
// ═══════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════
let charts         = {};
let currentFilters = {};
let currentPage    = 1;
let filterTimer    = null;
let sortState      = { campo: 'dataOrigem', dir: 'desc' };
let tableRows      = [];
let selectedRow    = null;
let kpiAlertTimer  = null;
let pendingKpiData = null;
let lastDashResp   = null;   // stores last full dashboard response for report generation
let ignoredDecisionClients = [];
let decisionPeriod = '30d';

const INTERVALO_ALERTA = 2 * 60 * 60 * 1000;

// ═══════════════════════════════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setText(id, val) { document.getElementById(id).textContent = val; }
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function isValidNumericValue(v) {
  if (v === null || v === undefined) return false;
  if (typeof v === 'string' && v.trim() === '') return false;
  return Number.isFinite(Number(v));
}

// ─── System message ──────────────────────────────────────────────────────────
function showSystemMsg(type, msg) {
  const el = document.getElementById('systemMsg');
  if (!el) return;
  el.innerHTML = '<div class="alert alert-' + type + ' alert-dismissible py-2 mb-0 fade show" role="alert">' +
    esc(msg) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}
function clearSystemMsg() {
  const el = document.getElementById('systemMsg');
  if (el) el.innerHTML = '';
}

function showErr(msg) {
  const loader = document.getElementById('globalLoader');
  loader.innerHTML =
    '<div class="text-center">' +
    '<div class="text-danger fs-4 mb-2">⚠️</div>' +
    '<div class="text-danger">' + esc(msg) + '</div>' +
    '<button class="btn btn-sm btn-outline-secondary mt-3" onclick="fetchData()">Tentar novamente</button>' +
    '</div>';
  loader.style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  setupTabTransitions();
  fetchData();
  startKPIReminder();
  setInterval(fetchData, 5 * 60 * 1000);
});

function setupTabTransitions() {
  const tabContent = document.querySelector('.dashboard-tab-content');
  const tabs = document.querySelectorAll('#mainTabs [data-bs-toggle="tab"]');
  if (!tabContent || !tabs.length) return;

  tabs.forEach(tab => {
    tab.addEventListener('show.bs.tab', () => {
      tabContent.classList.add('tab-switching');
    });
    tab.addEventListener('shown.bs.tab', () => {
      window.setTimeout(() => tabContent.classList.remove('tab-switching'), 90);
    });
  });
}

function resetLoader() {
  const loader = document.getElementById('globalLoader');
  loader.innerHTML = '<div class="spinner-border text-primary mb-3"></div><div class="text-muted">Carregando Dashboard...</div>';
  loader.style.display = 'flex';
}

function fetchData() {
  currentPage = 1;
  resetLoader();
  loadDashboard(withDecisionPeriod(currentFilters));
}

function withDecisionPeriod(filters) {
  return Object.assign({}, filters || {}, { decisionPeriod });
}

// ═══════════════════════════════════════════════════════════════════════════
// Dashboard
// ═══════════════════════════════════════════════════════════════════════════
function loadDashboard(filters) {
  google.script.run
    .withSuccessHandler(resp => {
      document.getElementById('globalLoader').style.display = 'none';
      if (!resp || !resp.ok) {
        showErr('Erro ao carregar o dashboard — ' + (resp ? resp.error : 'Sem resposta do servidor'));
        return;
      }
      clearSystemMsg();
      lastDashResp = resp;
      renderAll(resp);
      document.getElementById('lastUpdate').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
    })
    .withFailureHandler(err => {
      document.getElementById('globalLoader').style.display = 'none';
      showErr('Erro no servidor: ' + err.message);
    })
    .getDashboardData(JSON.stringify(filters));
}

function applyFilter() {
  currentPage = 1;
  currentFilters = {
    cliente:    document.getElementById('fCliente').value,
    dataInicio: document.getElementById('fDe').value,
    dataFim:    document.getElementById('fAte').value,
    versao:     document.getElementById('fVersao').value,
    revisao:    document.getElementById('fRevisao').value,
    requisito:  document.getElementById('fRequisito').value,
    sortCampo:  sortState.campo,
    sortDir:    sortState.dir,
  };
  loadDashboard(withDecisionPeriod(currentFilters));
}

function scheduleFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilter, 600);
}

function clearFilters() {
  ['fCliente','fDe','fAte','fVersao','fRevisao','fRequisito'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
  });
  applyFilter();
}

function setSort(campo) {
  if (sortState.campo === campo) {
    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortState.campo = campo;
    sortState.dir = 'desc';
  }
  updateSortIcons();
  applyFilter();
}

function updateSortIcons() {
  document.querySelectorAll('.sort-icon').forEach(el => el.textContent = '');
  const si = document.getElementById('si-' + sortState.campo);
  if (si) si.textContent = sortState.dir === 'asc' ? '▲' : '▼';
}

// ═══════════════════════════════════════════════════════════════════════════
// Render All
// ═══════════════════════════════════════════════════════════════════════════
function renderAll(resp) {
  const c = resp.cards;
  setText('cTotal',      c.total);
  setText('cHoje',       c.hoje);
  setText('cSemCaminho', c.semCaminho);
  setText('cMedia7',     c.media7d);
  setText('cMedia30',    c.media30d);
  setText('cClientes',   c.clientes);

  ['fCliente', 'rFCliente', 'decisionIgnoreSelect'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = id === 'decisionIgnoreSelect'
      ? '<option value="">Selecione...</option>'
      : '<option value="">Todos</option>';
    (resp.clientList || []).forEach(cli => {
      const opt = document.createElement('option');
      opt.value = cli; opt.textContent = cli;
      if (cli === cur) opt.selected = true;
      sel.appendChild(opt);
    });
  });

  renderDashCharts(resp.charts);
  renderRelCharts(resp.charts, resp.reports);
  renderDecision(resp.decision);
  renderTableData(resp.table.rows);
  tableRows = resp.table.rows;
  renderPaginacao(resp.table.page, resp.table.totalPages);
  document.getElementById('tableCount').textContent = '(' + resp.table.totalRows + ' registros)';
  updateSortIcons();
}

function riskClass(level) {
  if (level === 'Crítico') return 'danger';
  if (level === 'Atenção') return 'warning';
  return 'success';
}

function renderDecision(d) {
  if (!d) return;
  ignoredDecisionClients = d.ignoredClients || [];
  decisionPeriod = d.decisionPeriod || decisionPeriod || '30d';
  const periodSel = document.getElementById('decisionPeriodSelect');
  if (periodSel) periodSel.value = decisionPeriod;
  updateDecisionPeriodLabel();
  setText('dRisk', d.riskLevel || '—');
  setText('dRiskScore', 'Score ' + (d.riskScore || 0));
  setText('dTopClient', d.topClient ? d.topClient.name : '—');
  setText('dTopClientMeta', d.topClient ? ((d.topClient.total || 0) + ' registros · ' + (d.topClient.pct || 0) + '%') : '—');
  setText('dTopVersion', d.topVersion ? d.topVersion.name : '—');
  setText('dTopVersionMeta', d.topVersion ? ((d.topVersion.total || 0) + ' registros · ' + (d.topVersion.semCaminho || 0) + ' sem caminho') : '—');
  setText('dQuality', (d.dataQuality != null ? d.dataQuality : 0) + '%');
  setText('dQualityMeta', (d.semCaminho || 0) + ' sem caminho · revisão ' + (d.taxaRevisao || 0) + '%');

  const recEl = document.getElementById('decisionRecs');
  recEl.innerHTML = (d.recommendations || []).map(r =>
    '<div class="decision-item">' +
      '<span class="badge text-bg-' + riskClass(r.level) + '">' + esc(r.level) + '</span>' +
      '<div><strong>' + esc(r.title) + '</strong><p>' + esc(r.detail) + '</p></div>' +
    '</div>'
  ).join('');

  const rowsEl = document.getElementById('decisionClientRows');
  rowsEl.innerHTML = (d.topClients || []).map(r =>
    '<tr>' +
      '<td class="text-truncate" style="max-width:220px">' + esc(r.cliente) + '</td>' +
      '<td>' + r.total + '</td>' +
      '<td>' + r.pct + '%</td>' +
      '<td>' + r.semCaminho + '</td>' +
      '<td>' + r.taxaRevisao + '%</td>' +
      '<td><span class="badge text-bg-' + riskClass(r.status) + '">' + esc(r.status) + '</span></td>' +
    '</tr>'
  ).join('') || '<tr><td colspan="6" class="text-muted text-center py-3">Sem dados no filtro atual</td></tr>';

  const anomaliesEl = document.getElementById('decisionAnomalies');
  const anomalies = d.anomalies && d.anomalies.length ? d.anomalies : ['Nenhuma anomalia relevante detectada no recorte atual.'];
  anomaliesEl.innerHTML = anomalies.map(a =>
    '<div class="decision-item">' +
      '<span class="badge text-bg-' + (a.startsWith('Nenhuma') ? 'success' : 'warning') + '">' + (a.startsWith('Nenhuma') ? 'OK' : 'Alerta') + '</span>' +
      '<div><strong>' + esc(a) + '</strong></div>' +
    '</div>'
  ).join('');

  const h = d.health || {};
  document.getElementById('decisionHealth').innerHTML =
    '<div class="health-item"><span>Sem caminho</span><strong>' + (h.semCaminho || 0) + '</strong></div>' +
    '<div class="health-item"><span>Sem cliente</span><strong>' + (h.semCliente || 0) + '</strong></div>' +
    '<div class="health-item"><span>Sem versão</span><strong>' + (h.semVersao || 0) + '</strong></div>' +
    '<div class="health-item"><span>Sem requisito</span><strong>' + (h.semRequisito || 0) + '</strong></div>';
  renderIgnoredDecisionClients(d);
}

function renderIgnoredDecisionClients(d) {
  const wrap = document.getElementById('decisionIgnoredClients');
  const meta = document.getElementById('decisionIgnoredMeta');
  if (!wrap || !meta) return;
  if (!ignoredDecisionClients.length) {
    wrap.innerHTML = '<span class="text-muted small">Nenhum cliente ignorado.</span>';
  } else {
    wrap.innerHTML = ignoredDecisionClients.map(cli =>
      '<button class="decision-chip" onclick="removeIgnoredDecisionClient(' + JSON.stringify(cli).replace(/"/g, '&quot;') + ')">' +
        esc(cli) + '<span>×</span>' +
      '</button>'
    ).join('');
  }
  meta.textContent = (d.ignoredCount || 0) + ' registro(s) fora da análise decisória.';
}

function saveIgnoredDecisionClients(nextList) {
  google.script.run
    .withSuccessHandler(resp => {
      if (!resp || !resp.ok) {
        showSystemMsg('warning', 'Erro ao salvar clientes ignorados: ' + (resp ? resp.error : 'sem resposta'));
        return;
      }
      ignoredDecisionClients = resp.ignoredClients || [];
      fetchData();
    })
    .withFailureHandler(err => showSystemMsg('danger', 'Erro ao salvar clientes ignorados: ' + err.message))
    .saveIgnoredDecisionClients(JSON.stringify(nextList));
}

function addIgnoredDecisionClient() {
  const sel = document.getElementById('decisionIgnoreSelect');
  const cli = sel ? sel.value : '';
  if (!cli) return;
  const next = [...new Set([...ignoredDecisionClients, cli])].sort();
  saveIgnoredDecisionClients(next);
}

function removeIgnoredDecisionClient(cli) {
  const next = ignoredDecisionClients.filter(c => c !== cli);
  saveIgnoredDecisionClients(next);
}

function formatDecisionDate(value) {
  if (!value) return '';
  const parts = value.split('-');
  if (parts.length !== 3) return value;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function getDecisionFilters() {
  return {
    period: decisionPeriod,
    cliente: document.getElementById('rFCliente') ? document.getElementById('rFCliente').value : '',
  };
}

function updateDecisionPeriodLabel() {
  const el = document.getElementById('decisionPeriodLabel');
  if (!el) return;
  const f = getDecisionFilters();
  const periodMap = {
    '15d': 'últimos 15 dias',
    '30d': 'últimos 30 dias',
    '3m': 'últimos 3 meses',
    '7d': 'últimos 7 dias',
  };
  const period = periodMap[f.period] || 'últimos 30 dias';
  const client = f.cliente ? ' · Cliente: ' + f.cliente : '';
  el.textContent = 'Período analisado: ' + period + client;
}

function applyDecisionPeriod() {
  const sel = document.getElementById('decisionPeriodSelect');
  decisionPeriod = sel && sel.value ? sel.value : '30d';
  updateDecisionPeriodLabel();
  const filters = {
    cliente:    document.getElementById('rFCliente') ? document.getElementById('rFCliente').value : '',
    dataInicio: document.getElementById('rFDe') ? document.getElementById('rFDe').value : '',
    dataFim:    document.getElementById('rFAte') ? document.getElementById('rFAte').value : '',
    sortCampo:  sortState.campo,
    sortDir:    sortState.dir,
  };
  loadDashboard(withDecisionPeriod(filters));
}

// ═══════════════════════════════════════════════════════════════════════════
// Charts — Dashboard
// ═══════════════════════════════════════════════════════════════════════════
function renderDashCharts(ch) {
  destroyChart('chartCliHoje');
  destroyChart('chartVersoesHoje');
  document.querySelectorAll('.no-data-msg').forEach(el => el.remove());

  if (ch.cliHoje.labels.length) {
    charts.chartCliHoje = new Chart(document.getElementById('chartCliHoje'), {
      type: 'bar',
      data: { labels: ch.cliHoje.labels, datasets: [{ data: ch.cliHoje.data, backgroundColor: '#0d6efd', borderRadius: 4 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  } else {
    const p = document.createElement('p');
    p.className = 'text-muted small text-center mt-3 no-data-msg';
    p.textContent = 'Nenhum dado hoje';
    document.getElementById('chartCliHoje').parentElement.appendChild(p);
  }

  const vEntries  = Object.entries(ch.versoesHojeMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const totalHoje = vEntries.reduce((s,[,v])=>s+v, 0);
  const vEl = document.getElementById('versoesTotalHoje');
  if (vEl) vEl.textContent = totalHoje ? '(' + totalHoje + ' cópias)' : '';

  if (vEntries.length) {
    const colors = ['#0d6efd','#6610f2','#198754','#fd7e14','#dc3545','#0dcaf0','#20c997','#ffc107','#6f42c1','#d63384'];
    charts.chartVersoesHoje = new Chart(document.getElementById('chartVersoesHoje'), {
      type: 'bar',
      data: {
        labels: vEntries.map(([k]) => k),
        datasets: [{ data: vEntries.map(([,v]) => v), backgroundColor: vEntries.map((_,i) => colors[i%colors.length]), borderRadius: 4 }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: ctx => ' ' + ctx.raw + ' cópia(s)  —  ' + (totalHoje ? Math.round(ctx.raw*100/totalHoje) : 0) + '%' } } },
        scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } }, y: { ticks: { font: { size: 11 } } } }
      }
    });
  } else {
    const p = document.createElement('p');
    p.className = 'text-muted small text-center mt-3 no-data-msg';
    p.textContent = 'Nenhuma versão hoje';
    document.getElementById('chartVersoesHoje').parentElement.appendChild(p);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Charts — Relatórios
// ─── Inline data-label plugin (no external library needed) ───────────────────
// axis: 'vertical' (bars grow up) | 'horizontal' (bars grow right)
// opts.dsIndex : only label this dataset index (null = all bar datasets)
// opts.suffix  : string appended to value (e.g. '%')
// opts.color   : label fill color
function makeLabelPlugin(axis, opts) {
  opts = opts || {};
  const suffix  = opts.suffix  !== undefined ? opts.suffix  : '';
  const dsIndex = opts.dsIndex !== undefined ? opts.dsIndex : null;
  const color   = opts.color   || '#212529';
  const fs      = opts.fontSize || 10;
  return {
    id: 'inlineLabel',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = 'bold ' + fs + 'px sans-serif';
      chart.data.datasets.forEach((dataset, i) => {
        if (dsIndex !== null && i !== dsIndex) return;
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden || meta.type === 'line') return; // skip line overlays
        meta.data.forEach((el, j) => {
          const val = dataset.data[j];
          if (!val) return;
          const label = val + suffix;
          ctx.fillStyle = color;
          if (axis === 'horizontal') {
            ctx.textAlign    = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, el.x + 4, el.y);
          } else {
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(label, el.x, el.y - 2);
          }
        });
      });
      ctx.restore();
    }
  };
}

// ─── Inline point-label plugin for line charts ────────────────────────────────
// Shows values above each visible point; skips 0 and every other point when
// there are many data points to avoid clutter.
function makePointLabelPlugin(dsIndex, opts) {
  opts = opts || {};
  const suffix  = opts.suffix   !== undefined ? opts.suffix  : '';
  const color   = opts.color    || '#0d6efd';
  const fs      = opts.fontSize || 9;
  const step    = opts.step     || 1; // show every Nth point
  return {
    id: 'inlinePointLabel',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(dsIndex);
      if (!meta || meta.hidden) return;
      ctx.save();
      ctx.font = 'bold ' + fs + 'px sans-serif';
      ctx.fillStyle = color;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'bottom';
      meta.data.forEach((el, j) => {
        if (j % step !== 0) return;
        const val = chart.data.datasets[dsIndex].data[j];
        if (!val) return;
        ctx.fillText(val + suffix, el.x, el.y - 4);
      });
      ctx.restore();
    }
  };
}

// ═══════════════════════════════════════════════════════════════════════════
function renderRelCharts(ch, r) {
  document.getElementById('rTaxaRevisao').textContent =
    r.taxaRevisaoGlobal !== undefined ? r.taxaRevisaoGlobal + '%' : '—%';
  document.getElementById('rConcentracao').textContent = r.concentracao + '%';
  document.getElementById('rUltimos7').childNodes[0].nodeValue = r.ultimos7 + ' ';
  const tEl = document.getElementById('rTendencia7');
  if (r.tendencia7 > 0)      { tEl.textContent = '▲'+r.tendencia7+'%'; tEl.className = 'trend-up'; }
  else if (r.tendencia7 < 0) { tEl.textContent = '▼'+Math.abs(r.tendencia7)+'%'; tEl.className = 'trend-down'; }
  else                       { tEl.textContent = '='; tEl.className = 'trend-eq'; }
  const mesAtualIdx = r.mensal.labels.indexOf(r.mesAtualKey);
  document.getElementById('rMesAtual').textContent = mesAtualIdx >= 0 ? r.mensal.data[mesAtualIdx] : 0;
  document.getElementById('rSemCaminho').textContent = r.semCaminhoCount + ' (' + r.semCaminhoPerc + '%)';

  destroyChart('chartMensal');
  charts.chartMensal = new Chart(document.getElementById('chartMensal'), {
    type: 'bar',
    data: {
      labels: r.mensal.labels.map(l => l.substring(5)),
      datasets: [{ label: 'Cópias', data: r.mensal.data,
        backgroundColor: r.mensal.data.map((_,i,a) => i===a.length-1?'#0d6efd':'#adb5bd'), borderRadius: 4 }]
    },
    plugins: [makeLabelPlugin('vertical')],
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  destroyChart('chartSemana');
  const DAY_ORDER = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  charts.chartSemana = new Chart(document.getElementById('chartSemana'), {
    type: 'bar',
    data: { labels: DAY_ORDER, datasets: [{ data: DAY_ORDER.map(k => ch.weekMap[k]||0), backgroundColor: '#6610f2', borderRadius: 4 }] },
    plugins: [makeLabelPlugin('vertical', { color: '#6610f2' })],
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  destroyChart('chartTendencia');
  const trendY = ch.trend30.data, trendLine = calcTrendLine(trendY);
  charts.chartTendencia = new Chart(document.getElementById('chartTendencia'), {
    type: 'line',
    data: {
      labels: ch.trend30.labels,
      datasets: [
        { label: 'Cópias', data: trendY, fill: true, tension: .3, borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,.08)', pointRadius: 3 },
        { label: 'Tendência', data: trendLine, type: 'line', borderColor: '#dc3545', borderDash: [6,3], pointRadius: 0, tension: 0 },
      ]
    },
    plugins: [makePointLabelPlugin(0, { color: '#0d6efd', step: 3 })],
    options: { plugins: { legend: { labels: { font: { size: 10 } } } }, scales: { y: { beginAtZero: true } } }
  });

  destroyChart('chartPareto');
  charts.chartPareto = new Chart(document.getElementById('chartPareto'), {
    type: 'bar',
    data: {
      labels: r.pareto.labels,
      datasets: [
        { label: 'Qtd', data: r.pareto.data, backgroundColor: '#0d6efd', borderRadius: 4, yAxisID: 'y' },
        { label: '% Acum.', data: r.pareto.cumulative, type: 'line', borderColor: '#fd7e14', pointRadius: 3, tension: .3, yAxisID: 'y2' },
        { label: '80%', data: r.pareto.labels.map(()=>80), type: 'line', borderColor: '#dc3545', borderDash: [5,3], pointRadius: 0, yAxisID: 'y2' },
      ]
    },
    plugins: [makeLabelPlugin('vertical', { dsIndex: 0, color: '#0d6efd' })],
    options: {
      plugins: { legend: { labels: { font: { size: 10 } } } },
      scales: {
        y:  { beginAtZero: true, position: 'left' },
        y2: { beginAtZero: true, max: 100, position: 'right', grid: { drawOnChartArea: false }, ticks: { callback: v => v+'%' } },
      }
    }
  });

  destroyChart('chartTop10');
  charts.chartTop10 = new Chart(document.getElementById('chartTop10'), {
    type: 'bar',
    data: { labels: ch.top10.labels, datasets: [{ data: ch.top10.data, backgroundColor: '#198754', borderRadius: 4 }] },
    plugins: [makeLabelPlugin('horizontal', { color: '#198754' })],
    options: { indexAxis: 'y', layout: { padding: { right: 32 } },
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { display: false }, grid: { display: false } } } }
  });

  destroyChart('chartTopRevisoes');
  const revColors = r.topRevisoes.data.map(v => v>=10?'#dc3545':v>=5?'#ffc107':'#198754');
  charts.chartTopRevisoes = new Chart(document.getElementById('chartTopRevisoes'), {
    type: 'bar',
    data: {
      labels: r.topRevisoes.labels,
      datasets: [{ data: r.topRevisoes.data, backgroundColor: revColors, borderRadius: 4 }]
    },
    plugins: [makeLabelPlugin('horizontal', { color: '#212529', fontSize: 10 })],
    options: { indexAxis: 'y', layout: { padding: { right: 32 } },
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { display: false }, grid: { display: false } } } }
  });
}

function calcTrendLine(y) {
  const n = y.length;
  if (!n) return [];
  const sx = y.reduce((_,__,i)=>_+i,0), sy = y.reduce((a,b)=>a+b,0);
  const sxx = y.reduce((_,__,i)=>_+i*i,0), sxy = y.reduce((a,b,i)=>a+i*b,0);
  const d = n*sxx - sx*sx;
  if (!d) return y.map(()=>sy/n);
  const m = (n*sxy-sx*sy)/d, b = (sy-m*sx)/n;
  return y.map((_,i)=>Math.max(0,Math.round(m*i+b)));
}

  currentPage = page;

      clearSystemMsg();

      document.getElementById('tableCount').textContent = '(' + resp.totalRows + ' registros)';
    })
    .withFailureHandler(err => showSystemMsg('danger', 'Erro ao carregar página: ' + err.message))

function renderPaginacao(atual, total) {
  const nav = document.getElementById('paginacao');
  if (total <= 1) { nav.innerHTML = ''; return; }
  const ul = document.createElement('ul');
  ul.className = 'pagination pagination-sm mb-0';

  const mkItem = (label, page, disabled, active) => {
    const li = document.createElement('li');
    li.className = 'page-item' + (disabled?' disabled':'') + (active?' active':'');
    const a = document.createElement('a');
    a.className = 'page-link'; a.href = '#'; a.textContent = label;
    if (!disabled && !active) a.onclick = e => { e.preventDefault(); loadPage(page); };
    li.appendChild(a); ul.appendChild(li);
  };

  mkItem('«', atual-1, atual===1);
  const range = (s,e) => { for(let i=s;i<=e;i++) mkItem(i,i,false,i===atual); };
  if (total <= 7) range(1,total);
  else if (atual <= 4) { range(1,5); mkItem('…',null,true); mkItem(total,total,false,false); }
  else if (atual >= total-3) { mkItem(1,1,false,false); mkItem('…',null,true); range(total-4,total); }
  else { mkItem(1,1,false,false); mkItem('…',null,true); range(atual-1,atual+1); mkItem('…',null,true); mkItem(total,total,false,false); }
  mkItem('»', atual+1, atual===total);

  nav.innerHTML = ''; nav.appendChild(ul);
}

function fmtTs(ts) {
  if (!ts || ts.length < 16) return ts || '';
  const [date, time] = ts.split(' ');
  const [y, m, d]    = date.split('-');
  return d + '/' + m + '/' + y + ' ' + time.substring(0,5);
}

function renderSessionList(sessions) {
  const el = document.getElementById('sessionList');
  if (!sessions.length) { el.innerHTML = '<p class="text-muted small">Sem histórico</p>'; return; }
  el.innerHTML = sessions.map((s, i) => {
    const statusBadgeHtml = (s.status && s.status !== 'SUCESSO')
      ? '<span class="badge bg-danger ms-1">ERRO</span>'
      : '<span class="badge bg-secondary ms-1">' + (s.count||0) + ' reg.</span>';
    const origemTag = (s.origem && s.origem !== 'LEGADO' && s.origem !== 'MANUAL')
      ? '<span class="badge bg-info text-dark ms-1" style="font-size:.6rem">' + esc(s.origem) + '</span>'
      : (s.origem === 'LEGADO' ? '<span class="badge bg-secondary ms-1" style="font-size:.6rem;opacity:.6">legado</span>' : '');
    const parts = fmtTs(s.ts).split(' ');
    return '<div class="session-item ' + (i===0?'active':'') + '" ' +
      'data-sid="' + esc(s.id||s.ts) + '" data-ts="' + esc(s.ts) + '" onclick="viewSessionEl(this)">' +
      '<span class="d-flex flex-column" style="line-height:1.2">' +
        '<span>' + (parts[0]||'') + origemTag + '</span>' +
        '<small class="text-muted" style="font-size:.7rem">' + (parts[1]||'') + '</small>' +
      '</span>' + statusBadgeHtml + '</div>';
  }).join('');
}

function renderKPITableData(data) {
  const version_rows = data.filter(r => r.ALT_VERSAO !== 'TOTAL GERAL');

  const tbody = document.getElementById('kpiTBody');
  const tfoot = document.getElementById('kpiTFoot');

  function kpiBar(val, sem) {
    if (val == null) return '—';
    const v     = sem ? sem.toLowerCase() : '';
    const color = v.includes('verde') ? 'success' : v.includes('amarelo') ? 'warning' : 'danger';
    return '<div class="d-flex align-items-center gap-1" style="min-width:90px">' +
      '<div class="progress flex-grow-1" title="' + val.toFixed(1) + '%">' +
        '<div class="progress-bar bg-' + color + '" style="width:' + Math.min(100,val) + '%"></div>' +
      '</div><small>' + val.toFixed(1) + '%</small></div>';
  }

  function makeRow(r) {
    const hasCorrCorrd = r.KPI_CORRIGINDO_CORRIGIDO != null;
    return '<tr>' +
      '<td><strong>' + esc(r.ALT_VERSAO) + '</strong></td>' +
      '<td>' + r.ABERTA + '</td><td>' + r.ANDAMENTO + '</td>' +
      '<td>' + r.CORRIGINDO + '</td><td>' + r.CORRIGIDO + '</td>' +

      '<td>' + kpiBar(r.KPI_ABERTA_ANDAMENTO, r.SEMAFORO_ABERTA_ANDAMENTO) + '</td>' +
      '<td>' + (hasCorrCorrd ? kpiBar(r.KPI_CORRIGINDO_CORRIGIDO, r.SEMAFORO_CORRIGINDO_CORRIGIDO) : '<span class="text-muted small">N/D</span>') + '</td>' +
      '<td>' + kpiBar(r.KPI_CONFERIDO, r.SEMAFORO_CONFERIDO) + '</td>' +
    '</tr>';
  }

  tbody.innerHTML = version_rows.map(makeRow).join('');
  tfoot.innerHTML = total_row ? '<tr>' + makeRow(total_row).replace(/^<tr>/,'').replace(/<\/tr>$/,'') + '</tr>' : '';
}

// ─── KPI JSON Validation ──────────────────────────────────────────────────────
const REQUIRED_FIELDS = [
  'ALT_VERSAO','ABERTA','ANDAMENTO','CORRIGINDO','CORRIGIDO','CONFERIDO','TOTAL',
  'KPI_ABERTA_ANDAMENTO','KPI_CORRIGINDO_CORRIGIDO','KPI_CONFERIDO',
  'SEMAFORO_ABERTA_ANDAMENTO','SEMAFORO_CORRIGINDO_CORRIGIDO','SEMAFORO_CONFERIDO'
];
const NUMERIC_FIELDS = [
  'ABERTA','ANDAMENTO','CORRIGINDO','CORRIGIDO','CONFERIDO','TOTAL',
  'KPI_ABERTA_ANDAMENTO','KPI_CORRIGINDO_CORRIGIDO','KPI_CONFERIDO'
];

function validarJSON() {
  const raw     = document.getElementById('kpiJson').value.trim();
  const errDiv  = document.getElementById('kpiValidErrors');
  const infoDiv = document.getElementById('kpiValidInfo');
  const headEl  = document.getElementById('jsonPreviewHead');
  const bodyEl  = document.getElementById('jsonPreviewBody');
  const btnConf = document.getElementById('btnConfirmSave');

  errDiv.classList.add('d-none'); errDiv.innerHTML = '';
  infoDiv.classList.add('d-none');
  headEl.innerHTML = ''; bodyEl.innerHTML = '';
  btnConf.disabled = true;

  if (!raw) { alert('Cole o JSON antes de validar.'); return; }

  let data;
  try { data = JSON.parse(raw); }
  catch(e) { showKpiError('JSON malformado: ' + e.message); return; }

  if (!Array.isArray(data)) { showKpiError('O JSON deve ser um array de objetos.'); return; }
  if (!data.length)         { showKpiError('Array vazio.'); return; }

  const errors = [];
  data.forEach((item, i) => {
    const label   = item.ALT_VERSAO || '?';
    const missing = REQUIRED_FIELDS.filter(f => item[f] === undefined || item[f] === null);
    if (missing.length)
      errors.push('Item ' + (i+1) + ' (' + label + '): campos ausentes — ' + missing.join(', '));
    NUMERIC_FIELDS.forEach(f => {
      if (item[f] !== undefined && item[f] !== null && !isValidNumericValue(item[f]))
        errors.push('Item ' + (i+1) + ' (' + label + '): "' + f + '" valor inválido (recebido: "' + item[f] + '")');
    });
  });

  if (errors.length) {
    showKpiError('<ul class="mb-0">' + errors.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>', true);
    return;
  }

  const cols = ['ALT_VERSAO','ABERTA','ANDAMENTO','CORRIGINDO','CORRIGIDO','CONFERIDO','TOTAL',
                'KPI_ABERTA_ANDAMENTO','KPI_CORRIGINDO_CORRIGIDO','KPI_CONFERIDO',
                'SEMAFORO_ABERTA_ANDAMENTO','SEMAFORO_CORRIGINDO_CORRIGIDO','SEMAFORO_CONFERIDO'];

  headEl.innerHTML = '<tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr>';
  bodyEl.innerHTML = data.map(r =>
    '<tr>' + cols.map(c => {
      const v = r[c];
      if (v === undefined || v === null) return '<td class="text-muted">—</td>';
      if (typeof v === 'string' && v.toLowerCase().includes('verde'))    return '<td class="sem-verde">'    + esc(v) + '</td>';
      if (typeof v === 'string' && v.toLowerCase().includes('amarelo'))  return '<td class="sem-amarelo">'  + esc(v) + '</td>';
      if (typeof v === 'string' && v.toLowerCase().includes('vermelho')) return '<td class="sem-vermelho">' + esc(v) + '</td>';
      return '<td>' + esc(String(v)) + '</td>';
    }).join('') + '</tr>'
  ).join('');

  infoDiv.textContent = '✅ JSON válido — ' + data.length + ' registro(s) prontos para importação.';
  infoDiv.classList.remove('d-none');
  btnConf.disabled = false;
  pendingKpiData   = data;
  new bootstrap.Modal(document.getElementById('kpiValidModal')).show();
}

function showKpiError(message, trustedHtml) {
  const errDiv = document.getElementById('kpiValidErrors');
  if (trustedHtml) errDiv.innerHTML = message;
  else errDiv.textContent = message;
  errDiv.classList.remove('d-none');
  new bootstrap.Modal(document.getElementById('kpiValidModal')).show();
}

  if (!pendingKpiData) return;

    try { const m = bootstrap.Modal.getInstance(document.getElementById('kpiValidModal')); if (m) m.hide(); } catch(e) {}
  }

  google.script.run
    .withSuccessHandler(resp => {
      fecharModal();
      btnConf.disabled = false; btnConf.textContent = '✅ Confirmar e Salvar';
      if (!resp || !resp.ok) {
        document.getElementById('kpiImportMsg').innerHTML =
          '<span class="text-danger">❌ ' + esc(resp ? resp.error : 'Erro ao salvar') + '</span>';

      }
      const cards = resp.cards;
      const ch    = resp.charts;

      // Zip cliHoje arrays into sorted entries
      const cliMap = {};
      (ch.cliHoje.labels || []).forEach((lbl, i) => { cliMap[lbl] = (ch.cliHoje.data || [])[i] || 0; });
      const cliEntries = Object.entries(cliMap).sort((a,b) => b[1] - a[1]);

      // Sort versions by count
      const verEntries = Object.entries(ch.versoesHojeMap || {}).sort((a,b) => b[1] - a[1]);

      const lines = [];
      lines.push('📦 *Relatório de Cópias — ' + todayBR + '*');
      lines.push('');
      lines.push('📊 *Total gerado hoje:* ' + cards.hoje);

      if (cliEntries.length) {
        lines.push('');
        lines.push('👥 *Por Cliente:*');
        cliEntries.forEach(([cli, qtd]) => lines.push('  • ' + cli + ': ' + qtd + (qtd === 1 ? ' cópia' : ' cópias')));
      }

      if (verEntries.length) {
        lines.push('');
        lines.push('📋 *Por Versão:*');
        verEntries.forEach(([ver, qtd]) => lines.push('  • ' + ver + ': ' + qtd + (qtd === 1 ? ' cópia' : ' cópias')));
      }

      lines.push('');
      lines.push('_Gerado em ' + time + '_');

      document.getElementById('chatReportContent').textContent = lines.join('\n');
    })
    .withFailureHandler(err => {
      document.getElementById('chatReportContent').textContent = 'Erro: ' + err.message;
    })
    .getDashboardData(JSON.stringify({ dataInicio: today, dataFim: today }));
}

function copiarRelatorioChat() {
  const text = document.getElementById('chatReportContent').textContent;
  if (!text || text.startsWith('⏳') || text.startsWith('Erro')) return;
  navigator.clipboard.writeText(text).then(() => {
    showToast();
    try {
      const m = bootstrap.Modal.getInstance(document.getElementById('chatReportModal'));
      if (m) m.hide();
    } catch(e) {}
  }).catch(() => {});
}

// KPI 2-hour Reminder
// ═══════════════════════════════════════════════════════════════════════════
function startKPIReminder() {
  kpiAlertTimer = setInterval(mostrarAlertaKPI, INTERVALO_ALERTA);
}
function mostrarAlertaKPI() { document.getElementById('kpiAlert').classList.add('show'); }
function dispensarAlerta() {
  document.getElementById('kpiAlert').classList.remove('show');
  clearInterval(kpiAlertTimer);
  startKPIReminder();
}
function irParaKPI() {
  dispensarAlerta();
  const kpiBtn = document.querySelector('[data-bs-target="#tabKpi"]');
  if (kpiBtn) new bootstrap.Tab(kpiBtn).show();
}

document.querySelector('[data-bs-target="#tabKpi"]')
  .addEventListener('shown.bs.tab', () => { loadKpiData(); });

// ─── Relatórios filter ────────────────────────────────────────────────────────
let relFilterTimer = null;
function scheduleRelFilter() { clearTimeout(relFilterTimer); relFilterTimer = setTimeout(applyRelFilter, 600); }

function applyRelFilter() {
  const filters = {
    cliente:    document.getElementById('rFCliente').value,
    dataInicio: document.getElementById('rFDe').value,
    dataFim:    document.getElementById('rFAte').value,
    decisionPeriod,
    sortCampo:  sortState.campo,
    sortDir:    sortState.dir,
  };
  google.script.run
    .withSuccessHandler(resp => {
      if (!resp || !resp.ok) {
        showSystemMsg('warning', 'Erro ao filtrar relatórios: ' + (resp ? resp.error : 'sem resposta'));
        return;
      }
      clearSystemMsg();
      renderRelCharts(resp.charts, resp.reports);
      renderDecision(resp.decision);
    })
    .withFailureHandler(err => showSystemMsg('danger', 'Erro ao filtrar relatórios: ' + err.message))
    .getDashboardData(JSON.stringify(filters));
}

function clearRelFilters() {
  ['rFCliente','rFDe','rFAte'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
  });
  applyRelFilter();
}

// ─── KPI version filter ───────────────────────────────────────────────────────
function applyKpiVersionFilter() {
  const q = document.getElementById('kpiVersionFilter').value.toLowerCase().trim();
  document.querySelectorAll('#kpiTBody tr').forEach(tr => {
    tr.style.display = (!q || tr.cells[0].textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}
