<style>
:root{
  --bs-body-bg:#f5f7fb;
  --dash-surface:#fff;
  --dash-border:#dbe3ef;
  --dash-muted:#667085;
  --dash-ink:#182230;
  --dash-accent:#2454d6;
  --dash-shadow:0 10px 30px rgba(16,24,40,.08);
  --dash-shadow-sm:0 2px 10px rgba(16,24,40,.06);
}
body{
  font-size:.875rem;
  color:var(--dash-ink);
  background:linear-gradient(180deg,#eef3ff 0,#f5f7fb 260px),#f5f7fb;
}
.app-shell{max-width:1680px}

/* Header */
.dashboard-header{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(219,227,239,.95);
  border-radius:14px;
  box-shadow:var(--dash-shadow-sm);
  padding:1rem 1.15rem;
  backdrop-filter:saturate(140%) blur(8px);
}
.dashboard-header h5{letter-spacing:0;color:#101828}
.dashboard-eyebrow{
  color:var(--dash-accent);
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:.15rem;
}

/* Loader */
#globalLoader{position:fixed;inset:0;background:rgba(248,250,252,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#globalLoader .spinner-border{width:3rem;height:3rem}

/* KPI Alert */
#kpiAlert{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9000;min-width:360px;border-radius:0 0 .5rem .5rem;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#kpiAlert.show{display:flex!important}

/* System message */
#systemMsg .alert{border-radius:.5rem;font-size:.85rem}

/* Tabs */
.dashboard-tabs{
  background:rgba(255,255,255,.86);
  border:1px solid var(--dash-border);
  border-radius:12px;
  box-shadow:var(--dash-shadow-sm);
  padding:.35rem;
  gap:.25rem;
  position:sticky;
  top:.75rem;
  z-index:20;
  backdrop-filter:saturate(140%) blur(8px);
}
.dashboard-tabs .nav-link{
  border:0;
  border-radius:9px;
  color:#475467;
  font-weight:650;
  padding:.58rem .95rem;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  white-space:nowrap;
}
.dashboard-tabs .nav-link:hover{color:var(--dash-accent);background:#f4f7ff}
.dashboard-tabs .nav-link.active{
  color:#fff;
  background:linear-gradient(135deg,#2454d6,#1743b5);
  box-shadow:0 8px 18px rgba(36,84,214,.24);
}
.dashboard-tab-content{min-height:560px;transition:opacity .16s ease,transform .16s ease}
.dashboard-tab-content.tab-switching{opacity:.45;transform:translateY(4px)}
.dashboard-tab-content .tab-pane.show.active{animation:tabEnter .26s ease both}
@keyframes tabEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{border-color:var(--dash-border);box-shadow:var(--dash-shadow-sm)}
.card-header{border-bottom-color:var(--dash-border);background:#fff}
.card-metric{border:none;border-radius:12px;box-shadow:var(--dash-shadow-sm);transition:transform .15s,box-shadow .15s;overflow:hidden}
.card-metric:hover{transform:translateY(-2px);box-shadow:var(--dash-shadow)}
.card-metric .value{font-size:2rem;font-weight:700;line-height:1}
.card-metric .label{font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.btn{border-radius:8px;font-weight:600}
.btn-primary{background:var(--dash-accent);border-color:var(--dash-accent);box-shadow:0 4px 12px rgba(36,84,214,.18)}

/* Table */
.table-container{max-height:520px;overflow-y:auto;border-radius:0 0 12px 12px}
.table{--bs-table-hover-bg:#f8fbff}
.table thead th{position:sticky;top:0;background:#202939;color:#fff;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:0;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.table thead th:hover{background:#344054}
.table tbody td{vertical-align:middle;border-color:#edf1f7}
tr.sem-caminho-row td{background:#ffe5e5 !important}
tr.sem-caminho-row:hover td{background:#ffd0d0 !important}
.btn-copy{border:none;background:none;padding:0 4px;cursor:pointer;font-size:1rem;line-height:1;color:#6c757d;transition:color .15s}
.btn-copy:hover{color:#0d6efd}
.sort-icon{font-size:.65rem;margin-left:3px;opacity:.6}

/* Chart containers */
.chart-card{border:1px solid var(--dash-border);border-radius:12px;box-shadow:var(--dash-shadow-sm);background:#fff}
.chart-card .card-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--dash-muted)!important}

/* Relatorios mini-cards */
.mini-stat{border-radius:10px;padding:.75rem 1rem;color:#fff;font-weight:600;display:flex;align-items:center;gap:.75rem}
.mini-stat .num{font-size:1.6rem;line-height:1}
.mini-stat .lbl{font-size:.7rem;text-transform:uppercase;opacity:.9;line-height:1.2}
.trend-up{color:#198754}
.trend-down{color:#dc3545}
.trend-eq{color:#6c757d}

/* KPI Tab */
.kpi-card{border:1px solid var(--dash-border);border-radius:12px;box-shadow:var(--dash-shadow-sm);background:#fff}
.kpi-summary-card{border-radius:10px;padding:1rem 1.2rem;color:#fff;text-align:center}
.kpi-summary-card .val{font-size:1.8rem;font-weight:700;line-height:1}
.kpi-summary-card .lbl{font-size:.7rem;opacity:.9;text-transform:uppercase}
.sem-verde{background:#d1e7dd;color:#0a3622;border-radius:6px;padding:2px 8px;font-weight:600;font-size:.75rem}
.sem-amarelo{background:#fff3cd;color:#664d03;border-radius:6px;padding:2px 8px;font-weight:600;font-size:.75rem}
.sem-vermelho{background:#f8d7da;color:#58151c;border-radius:6px;padding:2px 8px;font-weight:600;font-size:.75rem}
.sem-cinza{background:#e2e3e5;color:#41464b;border-radius:6px;padding:2px 8px;font-weight:600;font-size:.75rem}
.progress{height:8px;border-radius:4px}
tfoot tr td{font-weight:700;background:#202939 !important;color:#fff !important}
.session-item{cursor:pointer;padding:.4rem .75rem;border-radius:6px;font-size:.8rem;transition:background .15s;display:flex;justify-content:space-between;align-items:center}
.session-item:hover{background:#eef4ff}
.session-item.active{background:var(--dash-accent);color:#fff;box-shadow:0 6px 16px rgba(36,84,214,.22)}
.session-item.active .text-muted{color:#cfe2ff!important}
.session-item .badge{font-size:.65rem}

/* JSON preview */
#jsonPreviewTable{font-size:.75rem}
#jsonPreviewTable td,#jsonPreviewTable th{padding:3px 6px}
.badge-status{font-size:.7rem;padding:3px 8px;border-radius:20px}
#quickFilter{max-width:220px}
.page-item .page-link{font-size:.8rem;padding:.3rem .6rem}

@media (max-width:768px){
  .dashboard-tabs{position:static;overflow-x:auto;flex-wrap:nowrap}
  .dashboard-header{border-radius:12px}
}
</style>
